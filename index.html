<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shorts Clipper</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Montserrat:wght@900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
:root{color-scheme:dark;--bg:#15110d;--panel:#211a14;--line:#3a2e23;--txt:#f4ede3;--mut:#a89a89;--acc:#ffd400;--red:#ff2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f6f1ea;--panel:#fff;--line:#d9cfc2;--txt:#1d1812;--mut:#6f6354}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:500 14px/1.4 Inter,system-ui,sans-serif;display:grid;grid-template-columns:minmax(330px,460px) 1fr;min-height:100vh}
@media(max-width:820px){body{grid-template-columns:1fr}main{order:-1;padding:10px}aside{max-height:none;border-right:0;border-top:1px solid var(--line)}canvas{height:min(66vh,calc((100vw - 20px)*16/9))!important}}
aside{padding:18px;border-right:1px solid var(--line);overflow:auto;max-height:100vh}
h1{font:400 30px Anton,Impact,sans-serif;margin:0 0 12px}h1 span{color:var(--acc)}
label{display:block;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number],select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font:inherit}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:100%;height:36px;padding:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;align-items:end}.row>*{flex:1;min-width:0}
button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:700 13px Inter,sans-serif;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.5}
button.main{background:var(--acc);color:#111;border-color:var(--acc)}button.rec{background:var(--red);border-color:var(--red);color:#fff}
.sec{font:400 19px Anton,Impact,sans-serif;margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line)}.sec.first{border:0;margin:0;padding:0}
.hint{color:var(--mut);font-size:12px;margin:4px 0 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mut);margin:8px 0;cursor:pointer}.drop.over{border-color:var(--acc);color:var(--acc)}
#list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}.clip.now{border-color:var(--acc)}
.clip .top{display:flex;justify-content:space-between;align-items:center;font:400 18px Anton,Impact,sans-serif;margin-bottom:6px}
.clip .top div{display:flex;gap:4px}.clip .top button{padding:4px 10px;font-size:12px}
.clip .f{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center}.clip .f button{padding:6px 8px;font-size:11px}
.chk{display:flex;gap:8px;align-items:center;color:var(--txt)}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;min-width:0}
canvas{height:min(80vh,calc((100vw - 40px)*16/9));max-width:100%;aspect-ratio:9/16;background:#000;border:1px solid var(--line);border-radius:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#scrub{width:min(100%,460px)}#status{text-align:center;min-height:20px}#info{color:var(--mut);font-size:12px;text-align:center}
</style>
</head>
<body>
<aside>
  <h1>Shorts <span>Clipper</span></h1>
  <div class="sec first">1. Source video</div>
  <div class="drop" id="drop">Drop a video here or click to choose<br><small>The clips are cut from this one video.</small></div>
  <input type="file" id="file" accept="video/*" hidden>

  <div class="sec">2. Clips</div>
  <div class="row">
    <div><label for="count">Number of clips</label><input type="number" id="count" min="1" max="30" value="1"></div>
    <button id="split">Auto-split evenly</button>
  </div>
  <p class="hint">Scrub the video, then press “Start = now” / “End = now” on a clip. Times are in seconds.</p>
  <div id="list"></div>

  <div class="sec">3. Title (on top of the video)</div>
  <label for="title">Text</label><input type="text" id="title" value="You will not believe this">
  <div class="row">
    <div><label for="tcol">Color</label><input type="color" id="tcol" value="#ffffff"></div>
    <div><label for="tfont">Font</label><select id="tfont"><option>Montserrat</option><option>Anton</option><option>Bangers</option><option>Impact</option></select></div>
  </div>
  <div class="row">
    <div><label for="tsize">Size</label><input type="range" id="tsize" min="40" max="160" value="86"></div>
    <div><label for="ty">Distance from top</label><input type="range" id="ty" min="40" max="500" value="230"></div>
  </div>
  <div class="row"><label class="chk"><input type="checkbox" id="tshow" checked> Show title</label>
  <div><label for="fit">Video fit</label><select id="fit"><option value="cover">Fill (crop)</option><option value="blur">Fit + blurred background</option><option value="contain">Fit (black bars)</option></select></div></div>
  <label class="chk"><input type="checkbox" id="guides" checked> Show YouTube safe zones</label>

  <div class="sec">4. Export</div>
  <div class="row">
    <div><label for="res">Size</label><select id="res"><option value="1080">1080×1920</option><option value="720">720×1280</option></select></div>
    <div><label for="br">Quality</label><select id="br"><option value="25000000">Max</option><option value="14000000" selected>High</option><option value="8000000">Normal</option></select></div>
  </div>
</aside>

<main>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <input type="range" id="scrub" min="0" max="1" step="0.01" value="0">
  <div class="bar">
    <button id="playall" class="main">Preview all clips</button>
    <button id="fast" class="rec">Fast export MP4</button>
    <button id="rt">Record in real time</button>
  </div>
  <div id="status">Add a video to begin.</div><div id="info"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), W = 1080, H = 1920;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const say = t => { $('status').textContent = t; };
const fnt = (n, s) => `${n === 'Montserrat' ? 900 : 400} ${s}px "${n}", Impact, sans-serif`;
let el = null, file = null, clips = [], running = false, stopFlag = false, recording = false, cur = -1, ac = null, dest = null, hooked = false, cancelExp = false;

const dur = c => Math.max(0.1, c.e - c.s);
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
function updInfo(){
  const t = clips.reduce((a, c) => a + dur(c), 0), m = Math.floor(t / 60), s = Math.round(t % 60);
  $('info').textContent = el ? `${clips.length} clip(s) · total ${m}:${String(s).padStart(2, '0')} · ` + (t <= 180 ? 'fits YouTube Shorts (3:00 max)' : 'longer than 3:00, too long for Shorts') : '';
}

/* ---------- load source ---------- */
function load(f){
  if(!f || !f.type.startsWith('video/')) return;
  if(el) URL.revokeObjectURL(el.src);
  file = f; el = document.createElement('video'); el.src = URL.createObjectURL(f); el.playsInline = true; el.preload = 'auto'; hooked = false;
  el.addEventListener('loadedmetadata', () => {
    $('scrub').max = el.duration; const d = el.duration;
    clips = [{s: 0, e: Math.min(d, 10)}]; $('count').value = 1; renderList(); el.currentTime = 0.05;
    say(`Loaded ${f.name} (${fmt(d)}).`);
  });
  el.addEventListener('timeupdate', () => { if(!running) $('scrub').value = el.currentTime; });
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => load(e.target.files[0]);
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('over'); load(e.dataTransfer.files[0]); };
$('scrub').oninput = () => { if(el && !running){ el.pause(); el.currentTime = +$('scrub').value; } };

/* ---------- clips ---------- */
function setCount(n){
  n = Math.max(1, Math.min(30, n | 0)); if(!el) return;
  while(clips.length > n) clips.pop();
  while(clips.length < n){ const s = clips.length ? Math.min(clips[clips.length - 1].e, Math.max(0, el.duration - 1)) : 0; clips.push({s, e: Math.min(el.duration, s + 5)}); }
  renderList();
}
$('count').onchange = () => setCount(+$('count').value);
$('split').onclick = () => {
  if(!el) return say('Add a video first.');
  const n = Math.max(1, Math.min(30, +$('count').value | 0)), d = el.duration / n;
  clips = Array.from({length: n}, (_, i) => ({s: +(i * d).toFixed(2), e: +((i + 1) * d).toFixed(2)})); renderList();
};
function renderList(){
  const box = $('list'); box.innerHTML = ''; $('count').value = clips.length;
  clips.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'clip' + (cur === i ? ' now' : '');
    d.innerHTML = `<div class="top"><span>Clip ${i + 1} · ${dur(c).toFixed(1)}s</span><div><button data-a="p">▶ Preview</button><button data-a="x">✕</button></div></div>
    <div class="f"><input type="number" step="0.1" min="0" data-k="s" value="${c.s.toFixed(2)}"><button data-a="s">Start = now</button><input type="number" step="0.1" min="0" data-k="e" value="${c.e.toFixed(2)}"><button data-a="e">End = now</button></div>`;
    d.querySelectorAll('input').forEach(inp => inp.onchange = () => { c[inp.dataset.k] = Math.max(0, Math.min(el.duration, +inp.value || 0)); renderList(); if(inp.dataset.k === 's'){ el.currentTime = c.s; } });
    d.querySelectorAll('button').forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if(a === 's'){ c.s = +el.currentTime.toFixed(2); if(c.e <= c.s) c.e = Math.min(el.duration, c.s + 3); renderList(); }
      else if(a === 'e'){ c.e = +el.currentTime.toFixed(2); if(c.e <= c.s) c.s = Math.max(0, c.e - 3); renderList(); }
      else if(a === 'x'){ if(clips.length > 1){ clips.splice(i, 1); renderList(); } }
      else if(a === 'p') playSeq([i]);
    });
    box.appendChild(d);
  });
  updInfo();
}

/* ---------- drawing ---------- */
const bgc = document.createElement('canvas'); bgc.width = 108; bgc.height = 192; const bgx = bgc.getContext('2d');
function drawVideo(){
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if(el && el.readyState >= 2 && el.videoWidth){
    const vw = el.videoWidth, vh = el.videoHeight, fit = $('fit').value;
    const put = (c, mode, w, h) => { const s = (mode === 'cover' ? Math.max : Math.min)(w / vw, h / vh); c.drawImage(el, (w - vw * s) / 2, (h - vh * s) / 2, vw * s, vh * s); };
    if(fit === 'blur'){ bgx.fillRect(0, 0, 108, 192); put(bgx, 'cover', 108, 192); ctx.drawImage(bgc, 0, 0, W, H); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H); put(ctx, 'contain', W, H); }
    else put(ctx, fit, W, H);
  } else { ctx.fillStyle = '#6b5a48'; ctx.font = '400 56px Anton, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Your video appears here', W / 2, H / 2); }
}
function drawTitle(){
  const words = $('title').value.trim().split(/\s+/).filter(Boolean); if(!$('tshow').checked || !words.length) return;
  let size = +$('tsize').value; const fam = $('tfont').value, maxW = W - 220;
  const wrap = () => { ctx.font = fnt(fam, size); const L = []; let line = ''; words.forEach(w => { const t = line ? line + ' ' + w : w; if(ctx.measureText(t).width > maxW && line){ L.push(line); line = w; } else line = t; }); L.push(line); return L; };
  let L = wrap(); while(L.length > 3 && size > 36){ size -= 4; L = wrap(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = size * .16;
  const lh = size * 1.18, y0 = +$('ty').value + lh / 2;
  L.forEach((t, i) => { ctx.strokeText(t, W / 2, y0 + i * lh); ctx.fillStyle = $('tcol').value; ctx.fillText(t, W / 2, y0 + i * lh); });
}
function drawGuides(){
  if(!$('guides').checked || recording) return;
  ctx.fillStyle = 'rgba(255,40,80,.25)'; ctx.fillRect(0, 0, W, 200); ctx.fillRect(0, H - 480, W, 480); ctx.fillRect(W - 210, H - 980, 210, 500);
  ctx.fillStyle = '#fff'; ctx.font = '600 26px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Phone covers the red areas (not in the export)', W / 2, H - 240);
}
function render(){ drawVideo(); drawTitle(); drawGuides(); }
(function loop(){ render(); requestAnimationFrame(loop); })();

/* ---------- preview ---------- */
async function playSeq(idx){
  if(!el) return say('Add a video first.');
  if(running){ stopFlag = true; return; }
  running = true; stopFlag = false; $('playall').textContent = 'Stop';
  for(const i of idx){
    if(stopFlag) break; const c = clips[i]; cur = i; renderList();
    el.currentTime = c.s; await sleep(120); el.muted = false; el.play().catch(() => {});
    say(`Playing clip ${i + 1} of ${clips.length}`);
    while(!stopFlag && !el.ended && el.currentTime < c.e) await sleep(30);
  }
  el.pause(); running = false; cur = -1; renderList(); $('playall').textContent = 'Preview all clips'; say('Preview finished.');
}
$('playall').onclick = () => playSeq(clips.map((_, i) => i));

/* ---------- real-time recording (backup) ---------- */
$('rt').onclick = async () => {
  if(!el) return say('Add a video first.'); if(running){ stopFlag = true; return; }
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)); if(!mime) return say('This browser cannot record. Use Chrome or Edge.');
  if(!hooked){ ac = ac || new AudioContext(); dest = dest || ac.createMediaStreamDestination(); const s = ac.createMediaElementSource(el); s.connect(dest); s.connect(ac.destination); hooked = true; }
  if(ac.state === 'suspended') await ac.resume();
  const small = $('res').value === '720', out = document.createElement('canvas'); out.width = small ? 720 : W; out.height = small ? 1280 : H;
  const o = out.getContext('2d'); let copying = true; (function cp(){ if(!copying) return; o.drawImage(cv, 0, 0, out.width, out.height); requestAnimationFrame(cp); })();
  const stream = out.captureStream(30); dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: +$('br').value, audioBitsPerSecond: 192000}), chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data); const done = new Promise(r => rec.onstop = r);
  recording = true; rec.start(1000); say('Recording in real time. Keep this tab open and visible.');
  await playSeq(clips.map((_, i) => i)); rec.stop(); await done; copying = false; recording = false;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, {type: mime})); a.download = 'short.' + (mime.startsWith('video/mp4') ? 'mp4' : 'webm'); a.click(); say('Saved.');
};

/* ---------- fast export: frame by frame MP4 with audio ---------- */
const seek = (v, t) => new Promise(r => { const d = () => { clearTimeout(to); v.removeEventListener('seeked', d); r(); }; const to = setTimeout(d, 3000); v.addEventListener('seeked', d); if(Math.abs(v.currentTime - t) < .0005) t += .0006; v.currentTime = t; });
$('fast').onclick = async () => {
  if(running){ if(recording) cancelExp = true; return; }
  if(!el) return say('Add a video first.');
  if(!window.VideoEncoder || !window.AudioEncoder || !window.Mp4Muxer) return say('Fast export needs Chrome or Edge and internet once to load the MP4 library. Use "Record in real time" instead.');
  running = recording = true; cancelExp = false; el.pause(); $('fast').textContent = 'Cancel export'; $('playall').disabled = $('rt').disabled = true;
  try{
    const FPS = 30, sr = 48000, small = $('res').value === '720', ow = small ? 720 : W, oh = small ? 1280 : H;
    const segs = []; let t0 = 0; clips.forEach(c => { segs.push({c, t0, d: dur(c)}); t0 += dur(c); }); const total = t0;
    say('Preparing audio…');
    const oac = new OfflineAudioContext(2, Math.ceil(total * sr), sr);
    try{ const buf = await oac.decodeAudioData(await file.arrayBuffer()); for(const s of segs){ const n = oac.createBufferSource(); n.buffer = buf; n.connect(oac.destination); n.start(s.t0, s.c.s, s.d); } }catch(e){ say('Could not read audio, exporting without sound.'); }
    const abuf = await oac.startRendering();
    const acfg = {codec: 'mp4a.40.2', sampleRate: sr, numberOfChannels: 2, bitrate: 192000}; let acodec = 'aac';
    if(!(await AudioEncoder.isConfigSupported(acfg)).supported){ acfg.codec = 'opus'; acodec = 'opus'; }
    const muxer = new Mp4Muxer.Muxer({target: new Mp4Muxer.ArrayBufferTarget(), video: {codec: 'avc', width: ow, height: oh}, audio: {codec: acodec, numberOfChannels: 2, sampleRate: sr}, fastStart: 'in-memory'});
    let err = null;
    const aenc = new AudioEncoder({output: (c, m) => muxer.addAudioChunk(c, m), error: e => { err = e; }}); aenc.configure(acfg);
    const Lc = abuf.getChannelData(0), Rc = abuf.getChannelData(1);
    for(let i = 0; i < abuf.length; i += sr){
      const n = Math.min(sr, abuf.length - i), data = new Float32Array(n * 2); data.set(Lc.subarray(i, i + n), 0); data.set(Rc.subarray(i, i + n), n);
      const ad = new AudioData({format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / sr * 1e6), data}); aenc.encode(ad); ad.close();
    }
    await aenc.flush();
    const venc = new VideoEncoder({output: (c, m) => muxer.addVideoChunk(c, m), error: e => { err = e; }});
    venc.configure({codec: 'avc1.640032', width: ow, height: oh, bitrate: +$('br').value, framerate: FPS});
    const out = document.createElement('canvas'); out.width = ow; out.height = oh; const o = out.getContext('2d'); o.imageSmoothingQuality = 'high';
    const nF = Math.round(total * FPS), started = performance.now();
    for(let f = 0; f < nF; f++){
      if(cancelExp) throw new Error('Export cancelled.'); if(err) throw err;
      const t = f / FPS, s = segs.find(x => t >= x.t0 && t < x.t0 + x.d) || segs[segs.length - 1];
      cur = clips.indexOf(s.c); await seek(el, Math.min(s.c.s + (t - s.t0), el.duration - .04));
      render(); o.drawImage(cv, 0, 0, ow, oh);
      const vf = new VideoFrame(out, {timestamp: Math.round(t * 1e6), duration: Math.round(1e6 / FPS)});
      while(venc.encodeQueueSize > 6) await sleep(4);
      venc.encode(vf, {keyFrame: f % (FPS * 2) === 0}); vf.close();
      if(f % 8 === 0){ const p = f / nF, e = (performance.now() - started) / 1000; say(`Rendering ${Math.round(p * 100)}%` + (p > .03 ? ` · about ${Math.max(1, Math.round(e / p - e))}s left` : '')); await sleep(0); }
    }
    await venc.flush(); muxer.finalize();
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([muxer.target.buffer], {type: 'video/mp4'})); a.download = 'short.mp4'; a.click();
    say('Done. Saved short.mp4 with audio, ready for YouTube Shorts.');
  }catch(e){ say('Export stopped: ' + (e && e.message || e)); }
  running = recording = false; cur = -1; $('fast').textContent = 'Fast export MP4'; $('playall').disabled = $('rt').disabled = false; renderList();
};
</script>
</body>
</html>
